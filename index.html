
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Centro de Alertas</title>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>
let oneSignalClient = null;

window.OneSignalDeferred = window.OneSignalDeferred || [];

OneSignalDeferred.push(async function(OneSignal) {
  const estado = document.getElementById("estado");

  try {
    await OneSignal.init({
      appId: "58b99d57-2454-4230-873a-13fd2dbc9ac6",
      serviceWorkerPath: "/mi-centro-de-alertas/OneSignalSDKWorker.js",
      serviceWorkerParam: {
        scope: "/mi-centro-de-alertas/"
      },
      serviceWorkerOverrideForTypical: true
    });

    oneSignalClient = OneSignal;
    estado.textContent = "Conectado con OneSignal. Listo para activar.";

  } catch (error) {
    estado.textContent = "ERROR DE CONEXIÓN: " + error.message;
  }
});

async function activarNotificaciones() {
  const estado = document.getElementById("estado");

  if (!oneSignalClient) {
    estado.textContent = "OneSignal todavía está cargando. Recarga la página.";
    return;
  }

  try {
    estado.textContent = "Solicitando permiso de notificaciones...";

    await oneSignalClient.Notifications.requestPermission();

    const permiso = oneSignalClient.Notifications.permission;

    if (!permiso) {
      estado.textContent = "Permiso no concedido. Revisa los ajustes del iPhone.";
      return;
    }

    estado.textContent = "Registrando tu dispositivo...";

    await oneSignalClient.User.PushSubscription.optIn();

    const suscrito = oneSignalClient.User.PushSubscription.optedIn;
    const id = oneSignalClient.User.PushSubscription.id;

    estado.textContent =
      "Permiso: " + permiso +
      " | Suscrito: " + suscrito +
      " | ID: " + (id || "Pendiente de registro");

  } catch (error) {
    estado.textContent = "ERROR: " + error.message;
  }
}
</script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding: 25px;
  color: #172033;
}

main {
  max-width: 500px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
}

h1 {
  color: #174ea6;
}

button {
  width: 100%;
  padding: 16px;
  margin: 8px 0;
  border: 0;
  border-radius: 10px;
  background: #174ea6;
  color: white;
  font-size: 16px;
}

p {
  color: #526078;
}

#estado {
  background: #eef2ff;
  padding: 12px;
  border-radius: 8px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>
<main>

<h1>Mi Centro de Alertas</h1>

<p>Tu espacio personal para recibir avisos importantes.</p>

<button onclick="activarNotificaciones()">
ACTIVAR MIS NOTIFICACIONES
</button>

<p id="estado">Conectando con OneSignal...</p>

<button onclick="alert('Alertas de citas de huellas TIE')">
Citas de huellas TIE
</button>

<button onclick="alert('Alertas de Extranjería y expedientes')">
Extranjería y expedientes
</button>

<button onclick="alert('Avisos de citas previas disponibles')">
Citas previas disponibles
</button>

<button onclick="alert('Alertas de ofertas de empleo')">
Ofertas de empleo
</button>

<button onclick="alert('Tus alertas personalizadas')">
Alertas personalizadas
</button>

</main>
</body>
</html>
